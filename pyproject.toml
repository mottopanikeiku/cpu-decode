[project]
name = "cpu-decode"
version = "0.1.0"
description = "Measure a small Qwen CPU decoder against bandwidth and llama.cpp"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0",
  "transformers==4.56.2",
  "huggingface-hub==0.35.3",
  "safetensors==0.6.2",
  "tokenizers==0.22.1",
  "numpy==2.3.3",
  "sentencepiece==0.2.1",
  "pytest==8.4.2",
  "protobuf==4.25.8",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
